<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | Marks Manager</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <a href="index.html" class="login-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <span>Marks Manager</span>
            </a>

            <div class="login-heading">
                <p class="section-tag">TEACHER PORTAL</p>
                <h1>Welcome Back 👋</h1>
                <p>Sign in to manage your students and academic records.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your username"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-wrapper password-wrapper">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Show password">

                            <i class="fa-solid fa-eye"></i>

                        </button>
                    </div>
                </div>

                <p id="loginMessage" class="form-message"></p>

                <button type="submit" class="login-submit-btn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login to Dashboard
                </button>

            </form>

            <div class="demo-login">
                <p><strong>Demo Login</strong></p>
                <span>Username: teacher</span>
                <span>Password: 1234</span>
            </div>

            <a href="index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Home
            </a>

        </section>

    </main>

    <!-- Login JavaScript -->
    <script src="js/login.js"></script>

</body>

</html>
