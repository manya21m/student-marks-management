<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student List | Marks Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

    <!-- Sidebar -->
    <aside class="sidebar">

        <a href="dashboard.html" class="sidebar-logo">
            <div class="logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <span>Marks Manager</span>
        </a>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="add-student.html" class="nav-item">
                <i class="fa-solid fa-user-plus"></i>
                <span>Add Student</span>
            </a>

            <a href="enter-marks.html" class="nav-item">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>Enter Marks</span>
            </a>

            <a href="students.html" class="nav-item active">
                <i class="fa-solid fa-users"></i>
                <span>Student List</span>
            </a>

            <a href="results.html" class="nav-item">
                <i class="fa-solid fa-square-poll-vertical"></i>
                <span>Results</span>
            </a>

        </nav>

        <button id="logoutBtn" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </button>

    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">

        <header class="page-header">
            <p class="header-date">STUDENT MANAGEMENT</p>
            <h1>Student List</h1>
            <p class="header-subtitle">
                View, search, and manage all student records.
            </p>
        </header>

        <section class="students-card">

            <div class="students-top-bar">

                <div>
                    <p class="section-tag">ALL STUDENTS</p>
                    <h2>Student Records</h2>
                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by name or USN">
                </div>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>USN</th>
                            <th>Course</th>
                            <th>Branch</th>
                            <th>Semester</th>
                            <th>Section</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentsTableBody">
                        <!-- Students will be loaded here -->
                    </tbody>

                </table>

            </div>

            <p id="emptyMessage" class="empty-message">
                Loading students...
            </p>

        </section>

    </main>

    <script src="js/students.js"></script>

</body>

</html>
